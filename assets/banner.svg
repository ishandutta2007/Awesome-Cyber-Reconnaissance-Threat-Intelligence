<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="radarBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .radar-sweep {
        transform-origin: 1020px 180px;
        animation: sweep 8s linear infinite;
      }
      .pulse-slow {
        animation: pulse 4s ease-in-out infinite;
      }
      .pulse-fast {
        animation: pulse 2.5s ease-in-out infinite alternate;
      }
      .float-node {
        animation: float 6s ease-in-out infinite alternate;
      }
      .stream-line {
        stroke-dasharray: 8 16;
        animation: dash 12s linear infinite;
      }

      @keyframes sweep {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes pulse {
        0% { opacity: 0.3; transform: scale(0.96); }
        50% { opacity: 0.8; transform: scale(1.02); }
        100% { opacity: 0.3; transform: scale(0.96); }
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-10px); }
      }
      @keyframes dash {
        to { stroke-dashoffset: -200; }
      }
    </style>
  </defs>

  <!-- Deep Cybersecurity Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Matrix / Grid Overlay (Background) -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Background Dynamic Radar Animation (Right Side) -->
  <g opacity="0.6">
    <circle cx="1020" cy="180" r="140" fill="none" stroke="#1e3a8a" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="1020" cy="180" r="100" fill="none" stroke="#0284c7" stroke-width="1.5" />
    <circle cx="1020" cy="180" r="60" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.6"/>
    <circle cx="1020" cy="180" r="20" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="880" y1="180" x2="1160" y2="180" stroke="#0369a1" stroke-width="1" stroke-opacity="0.4"/>
    <line x1="1020" y1="40" x2="1020" y2="320" stroke="#0369a1" stroke-width="1" stroke-opacity="0.4"/>

    <!-- Rotating Radar Sector -->
    <g class="radar-sweep">
      <path d="M 1020 180 L 1160 180 A 140 140 0 0 0 1119 81 Z" fill="url(#radarBeam)" />
    </g>

    <!-- Blinking Threat Recon Nodes on Radar -->
    <circle cx="1070" cy="120" r="4" fill="#ef4444" filter="url(#glowSoft)" class="pulse-fast"/>
    <circle cx="970" cy="220" r="3.5" fill="#f59e0b" filter="url(#glowSoft)" class="pulse-slow"/>
    <circle cx="1040" cy="250" r="3" fill="#10b981" filter="url(#glowSoft)"/>
    <circle cx="940" cy="140" r="3" fill="#38bdf8" filter="url(#glowSoft)" class="pulse-fast"/>
  </g>

  <!-- Connecting Recon Graph Trails (Dynamic Background streams) -->
  <g class="stream-line" stroke="#38bdf8" stroke-width="1.5" opacity="0.25" fill="none">
    <path d="M 100 300 Q 350 200 600 280 T 1020 180" />
    <path d="M 120 70 Q 400 120 750 90 T 1020 180" />
  </g>

  <!-- Ambient Glowing Orbs -->
  <circle cx="150" cy="80" r="120" fill="#38bdf8" opacity="0.08" filter="url(#glowCyan)"/>
  <circle cx="850" cy="280" r="100" fill="#a855f7" opacity="0.07" filter="url(#glowCyan)"/>

  <!-- FOREGROUND CONTENT: Header, Titles & Core Information (Clean & Crisp) -->
  <g transform="translate(60, 0)">
    
    <!-- Category Badge / Pill -->
    <g transform="translate(0, 48)">
      <rect width="360" height="30" rx="15" fill="#0f2942" stroke="#38bdf8" stroke-width="1.2" opacity="0.95"/>
      <circle cx="16" cy="15" r="5" fill="#22c55e" filter="url(#glowSoft)"/>
      <text x="32" y="20" fill="#e0f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1">
        CYBER RECONNAISSANCE &amp; THREAT INTEL
      </text>
    </g>

    <!-- Main Title -->
    <text x="0" y="132" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-1">
      Awesome Cyber Recon
    </text>
    <text x="445" y="132" fill="url(#accentCyan)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-1">
      &amp; Threat Intel
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="172" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400">
      Curated directory of industry-leading SaaS platforms &amp; high-impact open-source security tools.
    </text>

    <!-- Feature Attribute Badges / Ecosystem Pills -->
    <g transform="translate(0, 220)">
      <!-- Pill 1: OSINT & EASM -->
      <g transform="translate(0, 0)">
        <rect width="145" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
        <text x="14" y="22" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🌐 OSINT &amp; EASM</text>
      </g>
      <!-- Pill 2: Threat Intel Platforms -->
      <g transform="translate(155, 0)">
        <rect width="185" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
        <text x="14" y="22" fill="#a855f7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🛡️ Threat Intel (TIPs)</text>
      </g>
      <!-- Pill 3: Attack Surface Scanning -->
      <g transform="translate(350, 0)">
        <rect width="195" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
        <text x="14" y="22" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">⚡ Attack Surface Scan</text>
      </g>
      <!-- Pill 4: Dark Web Monitoring -->
      <g transform="translate(555, 0)">
        <rect width="185" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
        <text x="14" y="22" fill="#f43f5e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🕵️ Dark Web Tracking</text>
      </g>
    </g>

    <!-- Stats & Live Indicator Footnote -->
    <g transform="translate(0, 290)">
      <circle cx="6" cy="7" r="4" fill="#38bdf8" />
      <text x="20" y="11" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">
        Continuous Intelligence • Multi-Source Reconnaissance • Real-time Threat Correlation
      </text>
    </g>

  </g>
</svg>